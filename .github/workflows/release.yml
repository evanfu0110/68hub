name: Build & Release 2.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (for example v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify generated TypeScript bindings
        run: git diff --exit-code -- src/api/generated

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Build Windows bundle
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: 68HUB-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - name: Initialize Android project
        run: pnpm tauri android init --ci
      - name: Build unsigned arm64 APK
        run: pnpm tauri android build --apk --target aarch64 --ci
      - name: Restore test release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/68hub.keystore"
      - name: Sign APK
        run: |
          UNSIGNED_APK=$(find src-tauri/gen/android -type f -name '*unsigned.apk' | head -n 1)
          test -n "$UNSIGNED_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/68hub.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/68HUB-android-arm64.apk" \
            "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/68HUB-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: 68HUB-android-arm64
          path: ${{ runner.temp }}/68HUB-android-arm64.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate checksums
        run: find artifacts -type f -exec sha256sum {} \; > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: CHANGELOG.md
          files: |
            artifacts/**/*
            checksums.txt
