name: 功能建议 Feature Request
description: 建议 68HUB 新增或改进某项功能 (Suggest a new feature or improvement)
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ### 说明 Note
        请尽量把需求描述清楚（数据口径、展示位置、展示形式），可附截图或示意图，方便我们评估实现方案。
  - type: textarea
    id: background
    attributes:
      label: 需求背景 / 使用场景 Background
      description: 你希望解决什么问题？在什么场景下会用到？
      placeholder: 例如：我想在查看用量时一眼看到……
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望功能 Description
      description: 具体希望看到什么？请说明数据口径、展示位置和形式
      placeholder: |
        例如：
        - 口径：实时生成速度（tokens/s）
        - 位置：总览 Dashboard / Token 统计页
        - 形式：卡片数值或趋势图
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 参考示例 Reference
      description: 如有截图、示意图或同类产品示例，请粘贴链接或图片
    validations:
      required: false
